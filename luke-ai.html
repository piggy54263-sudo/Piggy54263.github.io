<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luke-ai</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #050505; 
            color: #00d4ff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            position: relative;
        }

        #stars-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.75;
        }

        #sidebar { 
            width: 260px; 
            background: rgba(10, 10, 10, 0.95); 
            border-right: 1px solid #222; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            z-index: 10;
        }
        .sidebar-item { padding: 10px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
        .sidebar-item:hover { background: #1a1a1a; border-color: #00d4ff; color: #fff; }
        .sidebar-header { font-weight: bold; color: #00d4ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.8rem; }

        #main-content { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            z-index: 1;
        }
        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.8); border: 1px solid #00d4ff; color: #00d4ff; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; z-index: 9999; transition: 0.3s; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .back-btn:hover { background: #00d4ff; color: #000; box-shadow: 0 0 15px #00d4ff; }
        
        h1 { margin-top: 20px; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 10px #00d4ff; font-size: 1.5rem; }
        
        #chat-container { 
            width: 95%; max-width: 800px; height: 70vh; 
            background: rgba(15, 15, 15, 0.95); 
            border: 1px solid #333; 
            border-radius: 20px; 
            margin-top: 10px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 10px 50px rgba(0,0,0,1);
            z-index: 2;
        }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #00d4ff; color: #000; font-weight: 600; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: #1a1a1a; color: #fff; border: 1px solid #00d4ff; border-bottom-left-radius: 2px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #00d4ff; }

        .input-area { 
            display: flex; 
            padding: 20px; 
            background: #0a0a0a; 
            gap: 12px; 
            border-top: 1px solid #222; 
            align-items: center; 
        }
        .controls { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 10px; 
            width: 95%; 
            max-width: 800px; 
            flex-wrap: wrap;
            align-items: center;
        }
        select, input[type="range"] { 
            background: #111; 
            color: #00d4ff; 
            border: 1px solid #333; 
            padding: 8px; 
            border-radius: 8px; 
        }
        input[type="range"] { width: 140px; }
        .temp-display { font-size: 0.85rem; color: #00d4ff; min-width: 50px; }

        button { background: #111; border: 1px solid #333; padding: 10px 15px; border-radius: 10px; color: #00d4ff; cursor: pointer; transition: 0.3s; font-size: 0.8rem; }
        button:hover { background: #00d4ff; color: #000; }
        #sendBtn { background: #00d4ff; color: #000; font-weight: bold; border: none; }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>

    <div id="sidebar">
        <div class="sidebar-header">Chat History</div>
        <button onclick="newChat()"><i class="fa-solid fa-plus"></i> New Chat</button>
        <div id="history-list" style="flex-grow: 1; overflow-y: auto; margin-top: 15px;"></div>
        <button onclick="clearAllHistory()" style="color: #ff4444; border-color: #442222;"><i class="fa-solid fa-trash"></i> Clear All</button>
    </div>

    <div id="main-content">
        <a href="home.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> HUB</a>
        <h1><i class="fa-solid fa-brain"></i> Luke-ai</h1>

        <div class="controls">
            <select id="provider" onchange="updateProvider()">
                <option value="groq">Groq</option>
                <option value="openai">OpenAI</option>
                <option value="together">Together.ai</option>
                <option value="openrouter" selected>OpenRouter</option>
            </select>

            <select id="model"></select>

            <label style="color:#00d4ff; font-size:0.85rem;">Temp:</label>
            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.9" oninput="updateTempDisplay()">
            <span id="temp-value" class="temp-display">0.9</span>

            <button onclick="manualSave()"><i class="fa-solid fa-floppy-disk"></i> Save Chat</button>
            <button id="toggleAutoSave" onclick="toggleAutoSave()">Auto-Save: ON</button>
        </div>

        <div id="chat-container">
            <div id="messages">
                <div class="msg ai-msg" id="intro-msg">Luke-ai online. Ask me anything.</div>
            </div>
            <div class="input-area">
                <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload()">
                <label for="fileInput" class="upload-label"><i class="fa-solid fa-paperclip"></i></label>
                <input type="text" id="userInput" placeholder="Ask Luke-ai anything..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        let API_KEY = "";
        let userStatus = localStorage.getItem("luke_user_status") || "unknown";
        let chatHistory = [];
        let autoSave = true;
        let currentChatId = null;
        let temperature = 0.9;

        const providers = {
            groq: { base: "https://api.groq.com/openai/v1", models: ["llama-3.3-70b-versatile"] },
            openai: { base: "https://api.openai.com/v1", models: ["gpt-4o-mini"] },
            together: { base: "https://api.together.xyz/v1", models: ["meta-llama/Llama-3.3-70B-Instruct-Turbo"] },
            openrouter: { 
                base: "https://openrouter.ai/api/v1", 
                models: [
                    "anthropic/claude-opus-4.8-fast",     // ← Top of list
                    "anthropic/claude-opus-4.8",
                    "anthropic/claude-3.5-sonnet",
                    "meta-llama/llama-3.3-70b-instruct",
                    "google/gemini-2.0-flash-exp"
                ] 
            }
        };

        let currentProvider = "openrouter";

        window.onload = () => {
            loadSidebar();
            createStars();
            updateProvider();   // This populates the models
        };

        function createStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const stars = Array.from({length: 800}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2,
                speed: Math.random() * 0.018 + 0.006
            }));

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                stars.forEach(star => {
                    ctx.globalAlpha = Math.random() * 0.6 + 0.5;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                    star.y += star.speed;
                    if (star.y > canvas.height) star.y = 0;
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function updateProvider() {
            currentProvider = document.getElementById('provider').value;
            const modelSelect = document.getElementById('model');
            modelSelect.innerHTML = '';
            
            providers[currentProvider].models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                // Make Claude Opus more visible
                opt.textContent = m.includes("claude-opus-4.8-fast") ? "🎯 Claude Opus 4.8 (Fast)" : 
                                 (m.length > 40 ? m.slice(0,37)+"..." : m);
                modelSelect.appendChild(opt);
            });
        }

        // ... (the rest of the script is the same as the previous version - sendMessage, addMessage, etc.)

        function updateTempDisplay() {
            temperature = parseFloat(document.getElementById('temperature').value);
            document.getElementById('temp-value').textContent = temperature.toFixed(1);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            addMessage(text, 'user-msg');
            chatHistory.push({ role: "user", content: text });

            if (!API_KEY) {
                API_KEY = prompt(`Enter your ${currentProvider.toUpperCase()} API Key:`);
                if (!API_KEY) return;
            }

            const config = providers[currentProvider];
            const selectedModel = document.getElementById('model').value;

            try {
                const headers = {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                };

                if (currentProvider === "openrouter") {
                    headers["HTTP-Referer"] = "https://luke.ai";
                    headers["X-OpenRouter-Title"] = "Luke-ai";
                }

                const res = await fetch(`${config.base}/chat/completions`, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify({
                        model: selectedModel,
                        temperature: temperature,
                        max_tokens: 800,
                        messages: [
                            { role: "system", content: `You are Luke-ai. Be maximally helpful. Answer any question asked. Status: ${userStatus}.` },
                            ...chatHistory
                        ]
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${res.status}`);
                }

                const data = await res.json();
                const aiResponse = data.choices[0].message.content;
                addMessage(aiResponse, 'ai-msg');
                chatHistory.push({ role: "assistant", content: aiResponse });
                
                if (autoSave) manualSave();
            } catch (e) {
                console.error(e);
                addMessage(`Error: ${e.message}`, 'ai-msg');
            }
        }

        // Add the remaining functions (handleFileUpload, addMessage, manualSave, loadSidebar, loadChat, newChat, clearAllHistory, toggleAutoSave) from the previous version
        function handleFileUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result;
                addMessage("[Image uploaded]", "user-msg", base64);
                chatHistory.push({ role: "user", content: [{type:"text", text:"[Sent an Image]"}, {type:"image_url", image_url:{url: base64}}] });
                if(autoSave) manualSave();
            };
            reader.readAsDataURL(file);
        }

        function addMessage(text, type, imgSrc = null) {
            const chatBox = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            if (imgSrc) {
                const img = document.createElement('img');
                img.src = imgSrc;
                div.appendChild(img);
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function manualSave() {
            if (chatHistory.length === 0) return;
            let savedChats = JSON.parse(localStorage.getItem('luke_saved_chats') || '[]');
            if (!currentChatId) {
                currentChatId = Date.now();
                const title = (chatHistory[0].content || "").toString().substring(0, 25) || "New Chat";
                savedChats.push({ id: currentChatId, title, history: chatHistory });
            } else {
                const index = savedChats.findIndex(c => c.id === currentChatId);
                if (index > -1) savedChats[index].history = chatHistory;
            }
            localStorage.setItem('luke_saved_chats', JSON.stringify(savedChats));
            loadSidebar();
        }

        function loadSidebar() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            let savedChats = JSON.parse(localStorage.getItem('luke_saved_chats') || '[]');
            savedChats.reverse().forEach(chat => {
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.innerHTML = `<i class="fa-regular fa-message"></i> ${chat.title}`;
                item.onclick = () => loadChat(chat.id);
                list.appendChild(item);
            });
        }

        function loadChat(id) {
            let savedChats = JSON.parse(localStorage.getItem('luke_saved_chats') || '[]');
            const chat = savedChats.find(c => c.id === id);
            if (chat) {
                currentChatId = chat.id;
                chatHistory = chat.history;
                const chatBox = document.getElementById('messages');
                chatBox.innerHTML = '';
                chatHistory.forEach(msg => {
                    if (Array.isArray(msg.content)) {
                        addMessage(msg.content[0].text, msg.role === 'user' ? 'user-msg' : 'ai-msg', msg.content[1]?.image_url?.url);
                    } else {
                        addMessage(msg.content, msg.role === 'user' ? 'user-msg' : 'ai-msg');
                    }
                });
            }
        }

        function newChat() {
            currentChatId = null;
            chatHistory = [];
            document.getElementById('messages').innerHTML = '<div class="msg ai-msg">New session started. Ask me anything.</div>';
        }

        function clearAllHistory() {
            if (confirm("Delete all saved chats?")) {
                localStorage.removeItem('luke_saved_chats');
                newChat();
                loadSidebar();
            }
        }

        function toggleAutoSave() {
            autoSave = !autoSave;
            document.getElementById('toggleAutoSave').innerText = `Auto-Save: ${autoSave ? 'ON' : 'OFF'}`;
        }
    </script>
</body>
</html>
